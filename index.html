<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="嘎宇宙 - 多人实时在线交流论坛" />
    <meta name="theme-color" content="#5E6AD2" />

    <!-- Open Graph -->
    <meta property="og:title" content="嘎宇宙" />
    <meta property="og:description" content="多人实时在线交流论坛" />
    <meta property="og:image" content="https://gagaga-d99.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:type" content="website" />

    <!-- 安全头 - 通过 HTTP 头设置，不在 meta 中设置 -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- 预加载关键资源 -->
    <link rel="preconnect" href="https://whdzgwnxyyyodspcvxha.supabase.co" />
    <link rel="dns-prefetch" href="https://whdzgwnxyyyodspcvxha.supabase.co" />

    <title>嘎宇宙</title>
    <script>
      // 渲染前设置主题，避免暗色模式用户刷新时先闪浅色（FOUC）
      (function () {
        try {
          var saved = localStorage.getItem('gagaga_theme')
          if (!saved) {
            saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', saved)
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.setAttribute('content', saved === 'dark' ? '#0F1115' : '#5E6AD2')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
