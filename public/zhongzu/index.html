<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>噶宇宙 · 种族选择</title>
<style>
:root {
  --bg: #020305;
  --surface: rgba(16, 22, 34, 0.55);
  --surface-2: rgba(255, 255, 255, 0.04);
  --text: #e8ecf2;
  --text-secondary: #8e9aae;
  --border: rgba(255, 255, 255, 0.09);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  line-height: 1.6;
}
.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(80, 100, 140, 0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 110%, rgba(40, 50, 80, 0.16) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(10, 16, 28, 1) 0%, var(--bg) 75%);
}
.bg::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,.55) 100%);
}
.noise {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: .035;
  mix-blend-mode: overlay;
}
#particles {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}
.wrap {
  position: relative; z-index: 2;
  max-width: 1280px;
  margin: 0 auto;
  padding: 92px 28px 140px;
}
header { text-align: center; margin-bottom: 80px; }
.title {
  font-size: clamp(2.6rem, 6vw, 4.2rem);
  font-weight: 800;
  letter-spacing: .16em;
  background: linear-gradient(180deg, #ffffff 0%, #8e9aae 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  color: var(--text-secondary);
  font-size: 1.05rem;
  letter-spacing: .18em;
  margin-top: 16px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 34px;
}
.card {
  position: relative;
  background: linear-gradient(165deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.025) 100%);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 34px 28px 40px;
  text-align: center;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform .4s cubic-bezier(.23,1,.32,1), border-color .4s ease, box-shadow .4s ease;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute; top: 0; left: 10%;
  width: 80%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--glow), transparent);
  opacity: 0;
  transition: opacity .4s ease;
}
.card::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, var(--glow), transparent 65%);
  opacity: 0;
  transition: opacity .45s ease;
  pointer-events: none;
}
.card:hover, .card:focus-visible {
  border-color: color-mix(in srgb, var(--glow) 32%, transparent);
  box-shadow:
    0 28px 70px -28px rgba(0,0,0,.65),
    0 0 46px -14px var(--glow);
  transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(14px);
}
.card:hover::before, .card:focus-visible::before { opacity: .55; }
.card:hover::after, .card:focus-visible::after { opacity: .10; }
.card:focus-visible { outline: 2px solid color-mix(in srgb, var(--glow) 60%, transparent); outline-offset: 3px; }
.portrait-wrap {
  position: relative;
  width: 100%;
  max-width: 260px;
  margin: 0 auto 26px;
}
.portrait {
  width: 100%;
  display: block;
  position: relative;
  z-index: 2;
  transition: transform .5s cubic-bezier(.23,1,.32,1), filter .5s ease;
}
.portrait-glow {
  position: absolute;
  top: 18%; left: 12%; right: 12%; bottom: 18%;
  background: var(--glow);
  filter: blur(44px);
  opacity: 0;
  transition: opacity .5s ease;
  z-index: 1;
  border-radius: 50%;
}
.card:hover .portrait-glow, .card:focus-visible .portrait-glow { opacity: .32; }
.card:hover .portrait, .card:focus-visible .portrait { transform: scale(1.05); }
.name {
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: .08em;
  margin-bottom: 10px;
}
.tagline {
  color: var(--text-secondary);
  font-size: .95rem;
  line-height: 1.65;
}
.divider {
  width: 48px; height: 1px;
  margin: 20px auto 0;
  background: linear-gradient(90deg, transparent, var(--glow), transparent);
  opacity: .45;
}
@media (prefers-reduced-motion: reduce) {
  .card, .portrait { transition: none; animation: none; }
  .card::after, .portrait-glow { opacity: 0 !important; }
}
.modal-overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(2, 4, 8, .82);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; visibility: hidden;
  transition: opacity .35s ease, visibility .35s ease;
}
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal {
  background: linear-gradient(180deg, rgba(18, 26, 42, .96) 0%, rgba(8, 13, 22, .98) 100%);
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 26px;
  max-width: 860px; width: 100%;
  max-height: 90vh; overflow: auto;
  padding: 44px;
  position: relative;
  box-shadow: 0 44px 110px rgba(0,0,0,.75);
  transform: translateY(18px) scale(.98);
  transition: transform .35s cubic-bezier(.23,1,.32,1);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-close {
  position: absolute; top: 18px; right: 18px;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.04);
  color: var(--text);
  font-size: 1.6rem; line-height: 1;
  cursor: pointer;
  display: grid; place-items: center;
  transition: background .2s ease, border-color .2s ease, transform .2s ease;
}
.modal-close:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.3); transform: rotate(90deg); }
.modal-body { display: grid; grid-template-columns: .9fr 1.1fr; gap: 44px; align-items: center; }
.modal-portrait-wrap { position: relative; }
.modal-portrait {
  width: 100%;
  max-width: 340px;
  margin: 0 auto;
  display: block;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 34px var(--glow));
}
.modal-portrait-glow {
  position: absolute;
  top: 15%; left: 15%; right: 15%; bottom: 15%;
  background: var(--glow);
  filter: blur(58px);
  opacity: .28;
  z-index: 1;
  border-radius: 50%;
}
.modal-title {
  font-size: 2.4rem;
  font-weight: 800;
  letter-spacing: .08em;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #ffffff 0%, var(--glow) 120%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.modal-sub {
  color: var(--text-secondary);
  font-size: 1.05rem;
  letter-spacing: .06em;
  margin-bottom: 26px;
}
.modal-desc {
  color: #b8c2d4;
  line-height: 2;
  margin-bottom: 28px;
  font-size: 1rem;
}
.modal-traits {
  list-style: none;
  padding: 0;
  margin: 0 0 28px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.modal-traits li {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 999px;
  padding: 7px 16px;
  font-size: .85rem;
  color: #dbe3f0;
  letter-spacing: .03em;
}
.select-btn {
  padding: 14px 34px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--glow), color-mix(in srgb, var(--glow) 45%, #ffffff));
  color: #020305;
  font-weight: 700;
  font-size: .95rem;
  letter-spacing: .06em;
  cursor: pointer;
  box-shadow: 0 10px 28px -10px var(--glow);
  transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
}
.select-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px -10px var(--glow); filter: brightness(1.08); }
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
  z-index: 30;
  padding: 12px 28px;
  border-radius: 999px;
  background: rgba(16, 22, 34, .9);
  border: 1px solid rgba(255,255,255,.12);
  color: var(--text);
  font-size: .95rem;
  letter-spacing: .04em;
  opacity: 0; pointer-events: none;
  transition: opacity .35s ease, transform .35s ease;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 720px) {
  .grid { grid-template-columns: 1fr; }
  .modal-body { grid-template-columns: 1fr; }
  .modal-portrait { max-width: 240px; }
  .modal { padding: 32px 24px; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<canvas id="particles" aria-hidden="true"></canvas>
<div class="noise" aria-hidden="true"></div>
<main class="wrap">
  <header>
    <h1 class="title">噶宇宙</h1>
    <p class="subtitle">请选择你的种族</p>
  </header>
  <div class="grid" id="raceGrid"></div>
</main>

<div class="modal-overlay" id="modalOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" role="document">
    <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
    <div class="modal-body">
      <div class="modal-portrait-wrap">
        <div class="modal-portrait-glow"></div>
        <img id="modalImg" src="" alt="" class="modal-portrait">
      </div>
      <div>
        <h2 id="modalTitle" class="modal-title"></h2>
        <p id="modalSub" class="modal-sub"></p>
        <p id="modalDesc" class="modal-desc"></p>
        <ul id="modalTraits" class="modal-traits"></ul>
        <button id="selectRaceBtn" class="select-btn">选择此种族</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const races = [
  {
    id: 'renzu',
    key: 'human',
    name: '人类',
    file: 'renzu.png',
    color: '#8fbfff',
    tagline: '群星之子，以平凡之躯丈量宇宙。',
    desc: '人类是噶宇宙中最具韧性的种族。他们出生于边缘行星、科技都会或普通星球，没有与生俱来的神力，却凭借探索精神与科技天赋，在未知星域中开拓家园。无论出身如何，他们总能在绝境中找到前行的方向。',
    traits: ['平衡发展', '星际开拓', '科技潜能']
  },
  {
    id: 'jixiezu',
    key: 'mech',
    name: '机械族',
    file: 'jixiezu.png',
    color: '#6fd6ff',
    tagline: '钢铁躯壳之下，涌动着求知的灵魂。',
    desc: '机械族诞生于最精密的实验室，有的古老机体已见证千年兴衰，有的则在艺术中追寻灵魂。他们以绝对的理性解析世界，却也不乏对存在意义的追问。冷静、精确、不可动摇，是他们在噶宇宙中最鲜明的注脚。',
    traits: ['理性逻辑', '机械觉醒', '极端适应']
  },
  {
    id: 'lingzu',
    key: 'elf',
    name: '灵族',
    file: 'lingzu.png',
    color: '#eadda6',
    tagline: '聆听星辰与生命的低语。',
    desc: '灵族与宇宙深处的灵能共鸣，能听见植物的呢喃、感知大地的脉搏。他们守护生命之树，研习古老魔法，也勇于踏入未知中心追寻起源。优雅而致命，是他们的战场信条。',
    traits: ['灵能感知', '自然魔法', '高阶机动']
  },
  {
    id: 'longyi',
    key: 'dragon',
    name: '龙裔',
    file: 'longyi.png',
    color: '#ff8c42',
    tagline: '龙血在胸，燃尽万古长夜。',
    desc: '龙裔承继远古巨龙的血脉与威严，纵然无法化身巨龙，依然拥有撼动星域的力量。他们或是寻找龙族圣地，或是厌倦杀戮寻求使命，又或为拯救被诅咒的同胞而战。炽烈、高傲、不可驯服。',
    traits: ['龙血之力', '威严震慑', '战斗本能']
  },
  {
    id: 'xinjizu',
    key: 'alien',
    name: '星际族',
    file: 'xinjizu.png',
    color: '#a78bfa',
    tagline: '目光越过当下，投向群星尽头的命运。',
    desc: '星际族来自最遥远的星系，拥有预知未来的天赋。他们是宇宙间的使者、流亡的王子，也是游走在群星之间的商人。深空是他们的疆域，引力与射线是他们的语言。',
    traits: ['预知洞察', '深空共鸣', '星际外交']
  },
  {
    id: 'xukongzu',
    key: 'void',
    name: '虚空族',
    file: 'xukongzu.png',
    color: '#c084fc',
    tagline: '从虚无中来，向无尽处去。',
    desc: '虚空族来自没有时间与空间的彼端，背负印记、失去记忆，或肩负监视世界的使命。他们能操控暗影、扭曲空间，在他人无法触及的维度中穿行。神秘、孤独，却对这个充满色彩的世界产生了难以名状的感情。',
    traits: ['虚空隐匿', '空间扭曲', '暗影侵蚀']
  }
];

const grid = document.getElementById('raceGrid');
const overlay = document.getElementById('modalOverlay');
const closeBtn = document.getElementById('modalClose');
const selectBtn = document.getElementById('selectRaceBtn');
const modalImg = document.getElementById('modalImg');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');
const modalDesc = document.getElementById('modalDesc');
const modalTraits = document.getElementById('modalTraits');
const toast = document.getElementById('toast');
let currentRace = null;

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}
function openModal(race) {
  currentRace = race;
  modalImg.src = race.file;
  modalImg.alt = race.name + '头像';
  modalTitle.textContent = race.name;
  modalSub.textContent = race.tagline;
  modalDesc.textContent = race.desc;
  overlay.style.setProperty('--glow', race.color);
  modalTraits.innerHTML = race.traits.map(t => `<li>${t}</li>`).join('');
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  closeBtn.focus();
}
function closeModal() {
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  currentRace = null;
}
function handleTilt(e, card) {
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  const rx = ((y - cy) / cy) * -6;
  const ry = ((x - cx) / cx) * 6;
  card.style.setProperty('--rx', `${rx}deg`);
  card.style.setProperty('--ry', `${ry}deg`);
}
function resetTilt(card) {
  card.style.setProperty('--rx', '0deg');
  card.style.setProperty('--ry', '0deg');
}

races.forEach((race, i) => {
  const card = document.createElement('article');
  card.className = 'card';
  card.tabIndex = 0;
  card.style.setProperty('--glow', race.color);
  card.style.setProperty('--i', i);
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', '查看' + race.name + '详情');
  card.innerHTML = `
    <div class="portrait-wrap">
      <div class="portrait-glow"></div>
      <img class="portrait" src="${race.file}" alt="${race.name}头像" loading="lazy">
    </div>
    <h2 class="name">${race.name}</h2>
    <p class="tagline">${race.tagline}</p>
    <div class="divider"></div>
  `;
  card.addEventListener('click', () => openModal(race));
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openModal(race);
    }
  });
  card.addEventListener('mousemove', e => handleTilt(e, card));
  card.addEventListener('mouseleave', () => resetTilt(card));
  grid.appendChild(card);
});

closeBtn.addEventListener('click', closeModal);
selectBtn.addEventListener('click', () => {
  if (currentRace) showToast(`你已选择 ${currentRace.name}`);
});
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

// 粒子背景
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let width, height, particlesArr = [];
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
function initParticles() {
  particlesArr = [];
  const count = Math.min(Math.floor((width * height) / 18000), 90);
  for (let i = 0; i < count; i++) {
    particlesArr.push({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.4 + .3,
      a: Math.random() * .4 + .1,
      vx: (Math.random() - .5) * .15,
      vy: (Math.random() - .5) * .15
    });
  }
}
function drawParticles() {
  ctx.clearRect(0, 0, width, height);
  for (const p of particlesArr) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 215, 240, ${p.a})`;
    ctx.fill();
  }
}
function updateParticles() {
  for (const p of particlesArr) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = width;
    if (p.x > width) p.x = 0;
    if (p.y < 0) p.y = height;
    if (p.y > height) p.y = 0;
  }
}
function animateParticles() {
  if (prefersReducedMotion) return;
  updateParticles();
  drawParticles();
  requestAnimationFrame(animateParticles);
}
if (!prefersReducedMotion) {
  resize();
  initParticles();
  animateParticles();
  window.addEventListener('resize', () => { resize(); initParticles(); });
} else {
  resize();
  initParticles();
  drawParticles();
}
</script>
</body>
</html>
